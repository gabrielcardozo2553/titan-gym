<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sala de entrenamiento">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f10"/>
      <stop offset="1" stop-color="#26301a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#fondo)"/>
  <!-- discos decorativos -->
  <g fill="none" stroke="#c6ff3d" stroke-opacity=".18" stroke-width="2">
    <circle cx="980" cy="210" r="190"/><circle cx="980" cy="210" r="140"/><circle cx="980" cy="210" r="90"/>
  </g>
  <!-- barra con discos -->
  <g fill="#c6ff3d">
    <rect x="620" y="198" width="520" height="24" rx="6" fill="#d4d4d8"/>
    <rect x="660" y="120" width="26" height="180" rx="6"/>
    <rect x="694" y="140" width="20" height="140" rx="5" fill="#e5ff9a"/>
    <rect x="1074" y="120" width="26" height="180" rx="6"/>
    <rect x="1046" y="140" width="20" height="140" rx="5" fill="#e5ff9a"/>
  </g>
  <text x="70" y="190" font-family="Impact, 'Arial Black', sans-serif" font-size="92" fill="#ffffff" letter-spacing="3">SUPERÁ</text>
  <text x="70" y="285" font-family="Impact, 'Arial Black', sans-serif" font-size="92" fill="#c6ff3d" letter-spacing="3">TUS LÍMITES</text>
</svg>
